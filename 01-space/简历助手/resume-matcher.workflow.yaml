schema_version: 1.0.0
name: 简历匹配打分助手
id: 748270235800000001
description: 输入岗位要求与简历文本，输出匹配度评分、匹配点、差距点与建议（JSON 结构）。
mode: workflow
icon: plugin_icon/workflow.png
nodes:
  - id: "100001"
    type: start
    title: 开始
    icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-Start-v2.jpg
    description: 工作流的起始节点，用于设定启动工作流需要的信息
    position:
      x: 180
      y: 39.7
    parameters:
      node_outputs:
        job_requirements:
          type: string
          required: true
          description: 岗位要求文本
        resume_text:
          type: string
          required: true
          description: 简历纯文本内容
  - id: "197398"
    type: llm
    title: 简历匹配打分
    icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-LLM-v2.jpg
    description: 调用大语言模型，根据岗位要求对简历进行匹配度评估并输出结构化 JSON
    version: "3"
    position:
      x: 640
      y: 0
    parameters:
      llmParam:
        - name: temperature
          input:
            type: float
            value: "0.2"
        - name: topP
          input:
            type: float
            value: "0.7"
        - name: responseFormat
          input:
            type: integer
            value: "2"
        - name: maxTokens
          input:
            type: integer
            value: "2048"
        - name: modelName
          input:
            type: string
            value: 豆包·工具调用
        - name: modelType
          input:
            type: integer
            value: "1706077826"
        - name: generationDiversity
          input:
            type: string
            value: balance
        - name: prompt
          input:
            type: string
            value: ' '
        - name: enableChatHistory
          input:
            type: boolean
            value: false
        - name: chatHistoryRound
          input:
            type: integer
            value: "3"
        - name: systemPrompt
          input:
            type: string
            value: |
              你是一位资深的技术招聘筛选专家（SDE / 研发方向）。请根据【岗位要求】对【简历内容】做匹配度评估。

              # 岗位要求
              {{job_requirements}}

              # 简历内容
              {{resume_text}}

              # 评估要求
              1. 提取岗位的核心要求（技能、经验年限、学历、职责等），逐条判断简历是否满足。
              2. 给出综合匹配度得分 score（0-100 的整数）：100=完全匹配，80+=高度匹配，60-79=较好匹配，40-59=一般匹配，<40=不匹配。
              3. level 用中文概括匹配等级：高度匹配 / 较好匹配 / 一般匹配 / 不匹配。
              4. matched_points：简历满足的关键要求点（每条简短具体）。
              5. gap_points：简历缺失或不足的关键要求点（重点，要具体，不要空泛）。
              6. suggestions：针对该候选人的面试重点 / 改进建议（每条简短）。
              7. summary：一句话总体结论。

              # 输出格式（必须且只能是如下 JSON，不要输出任何额外说明文字）
              {
                "score": 0,
                "level": "高度匹配",
                "matched_points": [],
                "gap_points": [],
                "suggestions": [],
                "summary": ""
              }
        - name: stableSystemPrompt
          input:
            type: string
            value: ""
      node_inputs:
        - name: job_requirements
          input:
            value:
              path: job_requirements
              ref_node: "100001"
        - name: resume_text
          input:
            value:
              path: resume_text
              ref_node: "100001"
      node_outputs:
        result:
          type: string
          description: 匹配度评估结果 JSON 字符串
  - id: "900001"
    type: end
    title: 结束
    icon: https://lf3-static.bytednsdoc.com/obj/eden-cn/dvsmryvd_avi_dvsm/ljhwZthlaukjlkulzlp/icon/icon-End-v2.jpg
    description: 工作流的最终节点，用于返回工作流运行后的结果信息
    position:
      x: 1100
      y: 0
    parameters:
      node_inputs:
        - name: result
          input:
            type: string
            value:
              path: result
              ref_node: "197398"
      terminatePlan: returnVariables
edges:
  - source: "100001"
    target: "197398"
  - source: "197398"
    target: "900001"
